name: Container

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified version to GitHub Container Registry
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: Version tag selected by the release workflow
        type: string
        required: true
      publish:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Build and exercise the Supabase deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TASKASAUR_IMAGE: taskasaur-ci:local
      TEST_APP_URL: http://localhost:3000
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run compose:verify
      - name: Read image version
        id: version
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const {version} = JSON.parse(fs.readFileSync('package.json'));
          if (!/^\d+\.\d+\.\d+(?:-[a-zA-Z0-9.-]+)?$/.test(version)) throw Error('Invalid version');
          const revision = execFileSync('git', ['rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version='+version+'\nrevision='+revision+'\n');
          NODE
      - name: Validate release version
        if: github.event_name == 'release' || inputs.ref != ''
        env:
          RELEASE_TAG: ${{ inputs.ref || github.event.release.tag_name }}
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: node -e "if(process.env.RELEASE_TAG!=='v'+process.env.PACKAGE_VERSION) throw Error('Release tag and package version differ')"
      - uses: docker/setup-buildx-action@v4
      - name: Build local image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          load: true
          tags: taskasaur-ci:local
          build-args: |
            TASKASAUR_VERSION=${{ steps.version.outputs.version }}
            SOURCE_REVISION=${{ steps.version.outputs.revision }}
          cache-from: type=gha,scope=taskasaur-amd64
          cache-to: type=gha,scope=taskasaur-amd64,mode=max
      - run: npm run setup
      - run: docker compose config --quiet
      - name: Start the official Supabase stack and Taskasaur
        run: docker compose up -d --no-build --wait --wait-timeout 240
      - name: Exercise worker dispatch and terminal gateway
        run: |
          node --import tsx tests/integration/automation.ts
          node --import tsx tests/integration/terminal.ts
      - name: Check persistence across application replacement
        run: |
          node --import tsx tests/integration/container-plugin.ts
          node tests/integration/container-upgrade.mjs prepare
          docker compose up -d --no-build --no-deps --force-recreate --wait --wait-timeout 120 app worker
          node tests/integration/container-upgrade.mjs verify
      - name: Show service health
        if: always()
        run: docker compose ps --all
      - name: Stop the isolated CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    name: Publish versioned amd64 and arm64 image
    needs: verify
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.revision }}
      - name: Set registry name
        id: registry
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'image=ghcr.io/'+process.env.GITHUB_REPOSITORY.toLowerCase()+'\n')"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.registry.outputs.image }}:${{ needs.verify.outputs.version }}
            ${{ steps.registry.outputs.image }}:sha-${{ needs.verify.outputs.revision }}
          build-args: |
            TASKASAUR_VERSION=${{ needs.verify.outputs.version }}
            SOURCE_REVISION=${{ needs.verify.outputs.revision }}
          cache-from: type=gha,scope=taskasaur-amd64
          provenance: true
          sbom: true
