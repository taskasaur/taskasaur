name: taskasaur-client
services:
  client:
    image: ${TASKASAUR_CLIENT_IMAGE:-taskasaur/taskasaur-client:0.2.0}
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile
    ports:
      - ${CLIENT_PORT:-8080}:8080
    environment:
      TASKASAUR_SERVER_URL: ${TASKASAUR_SERVER_URL:-http://host.docker.internal:3000}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${OFFICE_ASSET_PATH:-./.taskasaur/office-engine/wasm}:/usr/share/taskasaur-office:ro
    restart: unless-stopped
