map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  resolver 127.0.0.11 valid=5s ipv6=off;
  set $taskasaur_server "${TASKASAUR_SERVER_URL}";
  client_max_body_size 50m;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cross-Origin-Embedder-Policy require-corp always;
  add_header X-Content-Type-Options nosniff always;
  location ~ ^/(api/|auth/v1/|device-stream) {
    proxy_pass $taskasaur_server$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_ssl_server_name on;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
  location /office-engine/ {
    alias /usr/share/taskasaur-office/;
    sub_filter_once on;
    sub_filter '<script src="src/main.js" defer></script>' '<script src="/office-bridge.js" defer></script><script src="src/main.js" defer></script>';
  }
  location /assets/ { expires 1y; try_files $uri =404; }
  location ~ ^/(sw.js|offline-assets.json|manifest.webmanifest)$ { expires -1; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
