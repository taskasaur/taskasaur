server {
  listen 8080;
  client_max_body_size 50m;
  # Re-resolve Compose services after pull/recreate without restarting the proxy.
  resolver 127.0.0.11 valid=5s ipv6=off;
  resolver_timeout 5s;
  set $taskasaur_app http://app:3000;
  set $taskasaur_worker http://worker:8787;
  set $taskasaur_auth http://api-gw:8000;
  location /auth/v1/ {
    proxy_pass $taskasaur_auth;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /device-stream {
    proxy_pass $taskasaur_worker;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }
  location / {
    proxy_pass $taskasaur_app;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
  }
}
