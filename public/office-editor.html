<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LibreOffice</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #qtcanvas {
        width: 100%;
        height: 100%;
        border: 0;
        padding: 0;
        outline: 0;
        visibility: hidden;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font: 16px system-ui;
        background: #fff;
        color: #222;
      }
    </style>
  </head>
  <body>
    <div id="loading" role="status">Opening LibreOffice…</div>
    <canvas
      id="qtcanvas"
      contenteditable="true"
      aria-label="LibreOffice editor"
    ></canvas>
    <script src="/office-bridge.js"></script>
  </body>
</html>
